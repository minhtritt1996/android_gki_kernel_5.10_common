name: Redmi K60 (mondrian) - GKI 5.10 + AnyKernel3

on:
  workflow_dispatch:
  push:
    branches:
      - android12-5.10-2026-04_r1
  pull_request:
    branches:
      - android12-5.10-2026-04_r1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git \
            libelf-dev libssl-dev libncurses-dev pahole \
            python3 rsync unzip zip zstd \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Set up AOSP Clang toolchain
        run: |
          set -eux
          CLANG_DIR="${RUNNER_TEMP}/clang"
          mkdir -p "$CLANG_DIR"
          echo "Downloading Google AOSP Clang r416183b..."
          curl -fsSL --connect-timeout 30 --retry 3 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master-kernel-build-2021/clang-r416183b.tar.gz" \
            -o "${RUNNER_TEMP}/clang.tar.gz"
          tar -xzf "${RUNNER_TEMP}/clang.tar.gz" -C "$CLANG_DIR"
          rm -f "${RUNNER_TEMP}/clang.tar.gz"
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

      - name: Check Redmi K60 / Droidspaces configuration
        run: |
          set -eux
          echo "=== Device ==="
          echo "Redmi K60 / mondrian"
          echo "=== Droidspaces / namespace / container config ==="
          grep -E '^CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|USER_NS|NAMESPACES|UTS_NS|CGROUP_DEVICE|DEVTMPFS|OVERLAY_FS|NET_NS|VETH|BRIDGE|SECCOMP|NETFILTER_XT_SET|NETFILTER_XT_TARGET_REJECT|NETFILTER_XT_TARGET_LOG|NETFILTER_XT_MATCH_ADDRTYPE|NETFILTER_XT_MATCH_RECENT|IP_SET|IP_SET_HASH_IP|IP_SET_HASH_NET|TMPFS_POSIX_ACL|TMPFS_XATTR)=' \
            arch/arm64/configs/gki_defconfig || true

      - name: Build GKI
        env:
          OUT_DIR: ${{ github.workspace }}/out
          DIST_DIR: ${{ github.workspace }}/dist
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LLVM: "1"
          LLVM_IAS: "1"
        run: |
          set -euxo pipefail
          mkdir -p "$OUT_DIR"
          mkdir -p "$DIST_DIR"

          echo "Using Clang:"
          clang --version | head -n 2

          make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" gki_defconfig
          make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" -j"$(nproc)" Image Image.lz4 || \
          make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" -j"$(nproc)" Image

          if [ -f "$OUT_DIR/arch/arm64/boot/Image" ]; then
            cp "$OUT_DIR/arch/arm64/boot/Image" "$DIST_DIR/Image"
          fi
          if [ -f "$OUT_DIR/arch/arm64/boot/Image.lz4" ]; then
            cp "$OUT_DIR/arch/arm64/boot/Image.lz4" "$DIST_DIR/Image.lz4"
          fi

      - name: Verify kernel image
        run: |
          set -eux
          test -d dist
          find dist -maxdepth 2 -type f -printf '%p\n' | sort
          if [ -f dist/Image ]; then
            cp dist/Image Image
          elif [ -f dist/Image.lz4 ]; then
            cp dist/Image.lz4 Image.lz4
            echo "Image.lz4 found; AK3 will receive the compressed kernel."
          else
            echo "ERROR: no Image/Image.lz4 in dist"
            exit 1
          fi
          file Image* || true

      - name: Prepare AnyKernel3 for Redmi K60
        run: |
          set -eux
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

          rm -rf anykernel/.git
          rm -f anykernel/README.md anykernel/.gitignore
          rm -f anykernel/kernel Image.lz4
          cp Image anykernel/Image 2>/dev/null || cp Image.lz4 anykernel/Image.lz4

          cat > anykernel/anykernel.sh <<'EOF'
### AnyKernel3 - Redmi K60 (mondrian)
## GKI 5.10 kernel built by GitHub Actions

properties() { '
kernel.string=Redmi K60 (mondrian) - Droidspaces GKI 5.10
do.devicecheck=1
do.modules=0
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=mondrian
device.name2=
device.name3=
device.name4=
device.name5=
supported.versions=
supported.patchlevels=
supported.vendorpatchlevels=
'; }

boot_attributes() {
  set_perm_recursive 0 0 755 644 $RAMDISK/*;
  set_perm_recursive 0 0 750 750 $RAMDISK/init* $RAMDISK/sbin;
}

BLOCK=auto;
IS_SLOT_DEVICE=auto;
RAMDISK_COMPRESSION=auto;
PATCH_VBMETA_FLAG=auto;

. tools/ak3-core.sh;

dump_boot;
write_boot;
EOF

          cat > anykernel/README-mondrian.txt <<'EOF'
Redmi K60 (mondrian) - Android GKI 5.10 with Droidspaces Support
================================================================
This AnyKernel3 package replaces the kernel in the active boot slot.
It does not replace vendor_boot, dtbo, vendor_dlkm or other partitions.

Includes Droidspaces support:
- kABI-safe SYSVIPC & POSIX_MQUEUE
- Namespaces (IPC, PID, USER, NET, UTS)
- Networking (XT_SET, IP_SET, REJECT, LOG, MATCH_ADDRTYPE)
- devtmpfs & tmpfs ACL/xattr

Requirements:
- Redmi K60 (mondrian)
- Unlocked bootloader
- Compatible Android 12/13/14/15/16 GKI-based ROM
- Existing boot image must be readable by AnyKernel3/magiskboot

If the device fails to boot, restore the original boot image before
troubleshooting. Keep a backup of boot/vendor_boot/dtbo.
EOF

          chmod +x anykernel/anykernel.sh
          (cd anykernel && zip -r9 ../AnyKernel3-RedmiK60-mondrian-GKI-5.10.zip . -x .git/\* README.md '*placeholder*')

      - name: Generate checksums and inspect package
        run: |
          set -eux
          sha256sum AnyKernel3-RedmiK60-mondrian-GKI-5.10.zip > AnyKernel3-RedmiK60-mondrian-GKI-5.10.zip.sha256
          unzip -l AnyKernel3-RedmiK60-mondrian-GKI-5.10.zip
          cat AnyKernel3-RedmiK60-mondrian-GKI-5.10.zip.sha256

      - name: Upload GKI + AnyKernel3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Redmi-K60-mondrian-GKI-5.10-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/**
            out/**/.config
            AnyKernel3-RedmiK60-mondrian-GKI-5.10.zip
            AnyKernel3-RedmiK60-mondrian-GKI-5.10.zip.sha256
