name: Redmi K60 (mondrian) - GKI 5.10 + AnyKernel3

on:
  workflow_dispatch:
  push:
    branches:
      - android12-5.10-2026-04_r1
  pull_request:
    branches:
      - android12-5.10-2026-04_r1

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Free disk space and set up swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo fallocate -l 10G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          df -h

      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex git \
            libelf-dev libssl-dev libncurses-dev pahole \
            python3 rsync unzip zip zstd \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libncurses5 libtinfo5 || true

      - name: Set up AOSP Clang toolchain
        run: |
          set -eux
          CLANG_DIR="${RUNNER_TEMP}/clang"
          echo "Cloning AOSP Clang r416183b (build 7284624)..."
          git clone --depth=1 -b lineage-20.0 https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b.git "$CLANG_DIR"
          chmod +x "$CLANG_DIR/bin"/* || true
          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"

      - name: Check Redmi K60 / Droidspaces configuration
        run: |
          set -eux
          echo "=== Device ==="
          echo "Redmi K60 / mondrian"
          echo "=== Droidspaces / namespace / container config ==="
          grep -E '^CONFIG_(SYSVIPC|POSIX_MQUEUE|IPC_NS|PID_NS|USER_NS|NAMESPACES|UTS_NS|CGROUP_DEVICE|DEVTMPFS|OVERLAY_FS|NET_NS|VETH|BRIDGE|SECCOMP|NETFILTER_XT_SET|NETFILTER_XT_TARGET_REJECT|NETFILTER_XT_TARGET_LOG|NETFILTER_XT_MATCH_ADDRTYPE|NETFILTER_XT_MATCH_RECENT|IP_SET|IP_SET_HASH_IP|IP_SET_HASH_NET|TMPFS_POSIX_ACL|TMPFS_XATTR)=' \
            arch/arm64/configs/gki_defconfig || true

      - name: Build GKI
        env:
          OUT_DIR: ${{ github.workspace }}/out
          DIST_DIR: ${{ github.workspace }}/dist
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          LLVM: "1"
          LLVM_IAS: "1"
          KCFLAGS: "-D__ANDROID_COMMON_KERNEL__"
        run: |
          set -euxo pipefail
          mkdir -p "$OUT_DIR"
          mkdir -p "$DIST_DIR"

          echo "Using Clang:"
          clang --version | head -n 2

          make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" gki_defconfig
          
          set +e
          make O="$OUT_DIR" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" LLVM="$LLVM" LLVM_IAS="$LLVM_IAS" -j"$(nproc)" Image 2>&1 | tee "$OUT_DIR/build.log"
          BUILD_STATUS="${PIPESTATUS[0]}"
          set -e

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "::error::Kernel build failed with status $BUILD_STATUS"
            echo "=== Last 200 log lines ==="
            tail -n 200 "$OUT_DIR/build.log"
            exit "$BUILD_STATUS"
          fi

          if [ -f "$OUT_DIR/arch/arm64/boot/Image" ]; then
            cp "$OUT_DIR/arch/arm64/boot/Image" "$DIST_DIR/Image"
          else
            echo "::error::Image not found in $OUT_DIR/arch/arm64/boot/"
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: |
            ${{ github.workspace }}/out/build.log
            ${{ github.workspace }}/out/.config
          if-no-files-found: ignore

      - name: Verify kernel image
        run: |
          set -eux
          test -f dist/Image
          file dist/Image
          ls -lh dist/Image

      - name: Prepare AnyKernel3 for Redmi K60
        run: |
          set -eux
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel

          rm -rf anykernel/.git
          rm -f anykernel/README.md anykernel/.gitignore
          rm -f anykernel/kernel anykernel/Image.lz4
          cp dist/Image anykernel/Image

          cat > anykernel/anykernel.sh <<'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          ### AnyKernel setup
          # global properties
          properties() { '
          kernel.string=Redmi K60 (mondrian) - Droidspaces GKI 5.10
          do.devicecheck=0
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=mondrian
          device.name2=
          device.name3=
          device.name4=
          device.name5=
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; } # end properties

          ### AnyKernel install
          ## boot shell variables
          block=boot
          is_slot_device=auto
          ramdisk_compression=auto
          patch_vbmeta_flag=auto
          no_magisk_check=1

          # import functions/variables and setup patching - see for reference (DO NOT REMOVE)
          . tools/ak3-core.sh

          kernel_version=$(cat /proc/version | awk -F '-' '{print $1}' | awk '{print $3}')
          case $kernel_version in
              5.10*) supported=true ;;
              *) supported=false ;;
          esac

          ui_print " " "  -> supported: $supported"
          $supported || abort "  -> Not 5.10 device, abort."

          # boot install
          split_boot
          if [ -f "split_img/ramdisk.cpio" ]; then
              unpack_ramdisk
              write_boot
          else
              flash_boot
          fi
          ## end boot install
          EOF

          chmod +x anykernel/anykernel.sh
          (cd anykernel && zip -r9 ../AnyKernel3-RedmiK60-mondrian-GKI-5.10.zip . -x .git/\* README.md '*placeholder*')

      - name: Generate checksums and inspect package
        run: |
          set -eux
          sha256sum AnyKernel3-RedmiK60-mondrian-GKI-5.10.zip > AnyKernel3-RedmiK60-mondrian-GKI-5.10.zip.sha256
          unzip -l AnyKernel3-RedmiK60-mondrian-GKI-5.10.zip
          cat AnyKernel3-RedmiK60-mondrian-GKI-5.10.zip.sha256

      - name: Upload GKI + AnyKernel3 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-RedmiK60-mondrian-GKI-5.10-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/**
            out/**/.config
            AnyKernel3-RedmiK60-mondrian-GKI-5.10.zip
            AnyKernel3-RedmiK60-mondrian-GKI-5.10.zip.sha256
